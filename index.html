<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL DEFENSE | MONKEY CONTROL HELP LINE</title>
    <style>
        :root {
            --neon-red: #ff0055;
            --neon-cyan: #00f3ff;
            --neon-matrix: #39ff14;
            --laser-orange: #ffaa00;
            --dark-core: #050508;
            --panel-hex: #0d111a;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--dark-core);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(at 50% 0%, rgba(0, 243, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(255, 0, 85, 0.05) 0px, transparent 40%);
        }

        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 255, 0, 0.06));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .hq-frame {
            width: 95%;
            max-width: 1100px;
            margin: 30px 0;
            background: var(--panel-hex);
            border: 2px solid #1a2636;
            position: relative;
            border-radius: 12px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .hq-frame::before, .hq-frame::after {
            content: ""; position: absolute; width: 20px; height: 20px; border-color: var(--neon-cyan); border-style: solid;
        }
        .hq-frame::before { top: -2px; left: -2px; border-width: 4px 0 0 4px; }
        .hq-frame::after { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; }

        .header-system {
            text-align: center;
            border-bottom: 1px dashed #223344;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 6px;
            background: linear-gradient(90deg, #fff, var(--neon-cyan), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.6));
            animation: glitchGlance 4s infinite;
        }

        .welcome-msg {
            color: #7a8fa1;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }

        .dashboard-grid {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }

        .module-box {
            background: rgba(5, 7, 12, 0.8);
            border: 1px solid #1f2d3d;
            border-left: 4px solid var(--neon-cyan);
            padding: 30px 60px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .module-box.danger-zone {
            border-left-color: var(--neon-red);
        }

        .meta-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: #53697d;
            letter-spacing: 3px;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .dispatch-trigger-core {
            background: #ff0055;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 20px 60px;
            font-size: 2.2rem;
            font-weight: 900;
            font-family: 'Courier New', monospace;
            text-transform: uppercase;
            letter-spacing: 6px;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.6);
            transition: all 0.2s ease;
        }

        .dispatch-trigger-core:hover {
            background: #ffffff;
            color: #ff0055;
            box-shadow: 0 0 35px #ffffff;
        }

        .dispatch-trigger-core:disabled {
            border-color: #331122;
            color: #553344;
            background: rgba(20, 10, 15, 0.5);
            cursor: not-allowed;
            box-shadow: none;
        }

        .combat-theater {
            width: 100%;
            height: 280px;
            background: #04060a;
            border: 1px solid #1a2636;
            border-top: 3px solid #223344;
            border-bottom: 3px solid #223344;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }

        .radar-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: 50px 50px;
            background-image: 
                linear-gradient(to right, rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
        }

        .radar-sweep {
            position: absolute;
            width: 200%;
            height: 100%;
            background: linear-gradient(90deg, rgba(0, 243, 255, 0.08), transparent);
            transform: skewX(-25deg);
            animation: sweep 4s infinite linear;
        }

        .tactical-track {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 120px;
            transform: translateY(-50%);
            display: none;
        }

        .tactical-track.active {
            display: block;
        }

        .strike-group {
            position: absolute;
            display: flex;
            gap: 12px;
            align-items: center;
            height: 100%;
        }

        #fbi-strike-force { left: -420px; }
        #monkey-swarm { left: -260px; }

        .blueprint-vector {
            width: 60px;
            height: 60px;
        }

        #fbi-strike-force .blueprint-vector {
            filter: drop-shadow(0 0 12px rgba(0, 243, 255, 0.9));
        }

        #monkey-swarm .blueprint-vector {
            filter: drop-shadow(0 0 12px rgba(255, 170, 0, 0.9));
        }

        .system-ticker {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #53697d;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 2px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .termination-flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 7, 12, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 4px;
            box-shadow: inset 0 0 40px var(--neon-matrix);
            animation: borderPulse 1s infinite alternate;
        }

        .termination-flash.triggered {
            display: flex;
        }

        .flash-headline {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--neon-matrix);
            letter-spacing: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
            animation: textFlicker 0.4s infinite alternate;
            text-align: center;
            padding: 20px;
        }

        @keyframes sweep {
            0% { transform: translateX(-100%) skewX(-25deg); }
            100% { transform: translateX(100%) skewX(-25deg); }
        }
        @keyframes textFlicker {
            0% { opacity: 0.8; }
            100% { opacity: 1; transform: scale(1.02); }
        }
        @keyframes borderPulse {
            0% { box-shadow: inset 0 0 20px rgba(57, 255, 20, 0.4); }
            100% { box-shadow: inset 0 0 50px rgba(57, 255, 20, 0.9); }
        }
        @keyframes glitchGlance {
            0%, 94%, 98%, 100% { transform: scaleY(1) skewX(0deg); }
            95% { transform: scaleY(1.1) skewX(4deg); filter: hue-rotate(90deg); }
            97% { transform: scaleY(0.9) skewX(-4deg); }
        }
    </style>
</head>
<body>

    <div class="hq-frame">
        <div class="header-system">
            <h1>MONKEY CONTROL HELP LINE</h1>
            <div class="welcome-msg">Thank you for using the Monkey Control Help Line</div>
        </div>

        <div class="dashboard-grid">
            <div class="module-box danger-zone">
                <span class="meta-label">SYSTEM COMMAND</span>
                <button id="dispatchBtn" class="dispatch-trigger-core">DISPATCH</button>
            </div>
        </div>

        <div class="combat-theater">
            <div class="radar-grid"></div>
            <div class="radar-sweep"></div>
            
            <div id="tacticalTrack" class="tactical-track">
                <div id="fbi-strike-force" class="strike-group">

                        <path d="M14 52 C14 36, 50 36, 50 52" fill="#002244" stroke="#00f3ff" stroke-width="2.5"/>
                        <path d="M23 16 L31 20 L39 16" fill="none" stroke="#ff0055" stroke-width="2"/>
