<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MONKEY CONTROL HELP LINE</title>
    <style>
        body {
            background-color: #060913;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .terminal-header {
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background: #0d1321;
            border: 2px solid #ff9f43;
            border-radius: 12px;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.3rem;
            color: #ff9f43;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #48dbfb;
            font-weight: bold;
        }

        .btn-container {
            margin: 20px;
        }

        #dispatchBtn {
            background: #c0392b;
            color: white;
            border: 6px solid #ff6b6b;
            border-radius: 50%;
            width: 170px;
            height: 170px;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
        }

        #dispatchBtn:disabled {
            background: #222f3e;
            border-color: #57606f;
            color: #57606f;
            cursor: not-allowed;
        }

        #timerDisplay {
            font-size: 2.3rem;
            margin-top: 20px;
            color: #ff3838;
            display: none;
            font-weight: 900;
            background: #000000;
            padding: 12px 30px;
            border-radius: 8px;
            border: 2px solid #ff3838;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 260px;
            margin-top: 40px;
            background: #04060f;
            border-top: 4px solid #00d2d3;
            border-bottom: 4px solid #00d2d3;
            overflow: hidden;
            display: none;
        }

        .sprite-cluster {
            position: absolute;
            display: flex;
            align-items: flex-end;
            bottom: 20px;
            height: 160px;
        }

        .fbi-strike-team {
            display: flex;
            gap: 6px;
        }

        .operator {
            width: 70px;
            height: 130px;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 80 140"><rect x="22" y="50" width="36" height="55" fill="%232c3e50" stroke="%231a252f" stroke-width="2"/><rect x="26" y="55" width="28" height="30" fill="%231e272e"/><circle cx="40" cy="30" r="16" fill="%232c3e50"/><path d="M26,24 Q40,12 54,24 Q56,34 40,36 Q24,34 26,24" fill="%2311171d"/><rect x="28" y="22" width="24" height="11" fill="%23ffd32a" rx="2"/><rect x="18" y="52" width="10" height="40" fill="%2334495e" rx="4"/><rect x="52" y="52" width="10" height="40" fill="%2334495e" rx="4"/><rect x="24" y="105" width="14" height="30" fill="%231e272e"/><rect x="42" y="105" width="14" height="30" fill="%231e272e"/><rect x="45" y="60" width="40" height="12" fill="%23000000" rx="2" transform="rotate(-10, 45, 60)"/></svg>');
        }

        .monkey-swarm {
            display: flex;
            gap: 10px;
        }

        .rogue-monkey {
            width: 65px;
            height: 95px;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 80 100"><circle cx="40" cy="45" r="22" fill="%23574b90"/><circle cx="40" cy="43" r="16" fill="%23f7d794"/><circle cx="20" cy="38" r="8" fill="%23574b90"/><circle cx="60" cy="38" r="8" fill="%23574b90"/><circle cx="33" cy="38" r="3" fill="%23000"/><circle cx="47" cy="38" r="3" fill="%23000"/><path d="M32,54 Q40,62 48,54" fill="none" stroke="%23000" stroke-width="3"/><rect x="25" y="65" width="30" height="30" fill="%23574b90" rx="10"/></svg>');
        }

        @keyframes sweepRight {
            0% { left: -500px; }
            100% { left: 105%; }
        }

        @keyframes sweepLeft {
            0% { right: -500px; transform: scaleX(-1); }
            100% { right: 105%; transform: scaleX(-1); }
        }

        .run-east { animation: sweepRight 3.2s linear infinite; }
        .run-west { animation: sweepLeft 3.2s linear infinite; }
    </style>
</head>
<body>

    <div class="terminal-header">
        <h1>Thank you for using the Monkey Control Help Line.</h1>
        <div class="subtitle">TACTICAL OPERATIONAL COMMAND // CODE RED DISPATCH</div>
    </div>

    <div class="btn-container">
        <button id="dispatchBtn" onclick="triggerSystem()">Dispatch</button>
    </div>

    <div id="timerDisplay">TIME UNTIL ARRIVAL: 05:00</div>

    <div class="stage" id="chaseStage">
        <div class="sprite-cluster run-east">
            <div class="monkey-swarm">
                <div class="rogue-monkey"></div>
                <div class="rogue-monkey" style="transform: scale(0.8); margin-bottom: -10px;"></div>
                <div class="rogue-monkey"></div>
            </div>
            <div class="fbi-strike-team">
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
            </div>
        </div>
        
        <div class="sprite-cluster run-west" style="animation-delay: 1.6s;">
            <div class="monkey-swarm">
                <div class="rogue-monkey"></div>
                <div class="rogue-monkey"></div>
            </div>
            <div class="fbi-strike-team">
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
                <div class="operator"></div>
            </div>
        </div>
    </div>

    <script>
        function triggerSystem() {
            var btn = document.getElementById('dispatchBtn');
            var timer = document.getElementById('timerDisplay');
            var stage = document.getElementById('chaseStage');
            
            btn.disabled = true;
            timer.style.display = 'block';
            stage.style.display = 'block';

            setTimeout(function() {
                stage.style.display = 'none';
            }, 12000);

            var timeRemaining = 300; 
            var countdown = setInterval(function() {
                timeRemaining--;
                if (timeRemaining <= 0) {
                    clearInterval(countdown);
                    timer.innerText = "TACTICAL INTERCEPTION COMPLETE // ARRIVED";
                    btn.disabled = false;
                } else {
                    var minutes = Math.floor(timeRemaining / 60);
                    var seconds = timeRemaining % 60;
                    if (minutes < 10) minutes = '0' + minutes;
                    if (seconds < 10) seconds = '0' + seconds;
                    timer.innerText = 'TIME UNTIL ARRIVAL: ' + minutes + ':' + seconds;
                }
            }, 1000);
        }
    </script>
</body>
</html>
