<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Control Help Line</title>
    <style>
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #1c2430 0%, #0d0f12 100%);
        }

        h1 {
            font-size: 2.8rem;
            color: #ff9f43;
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 159, 67, 0.4);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8492a6;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Tactical Dispatch Button */
        #dispatchBtn {
            background: linear-gradient(135deg, #ff4757 0%, #ee5253 100%);
            color: white;
            border: 4px solid #ff6b81;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(238, 82, 83, 0.6), inset 0 4px 10px rgba(255,255,255,0.4);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            outline: none;
            letter-spacing: 1px;
        }

        #dispatchBtn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #ff6b81 0%, #ff4757 100%);
            box-shadow: 0 0 45px rgba(238, 82, 83, 0.9);
        }

        #dispatchBtn:active {
            transform: scale(0.95);
            box-shadow: 0 0 15px rgba(238, 82, 83, 0.5);
        }

        #dispatchBtn:disabled {
            background: #2f3542;
            border-color: #57606f;
            color: #747d8c;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Tactical Timer Display */
        #timerDisplay {
            font-size: 2.2rem;
            margin-top: 35px;
            font-family: 'Courier New', Courier, monospace;
            color: #ff4757;
            visibility: hidden;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 25px;
            border-radius: 6px;
            border: 2px solid #ff4757;
            box-shadow: 0 0 15px rgba(238, 82, 83, 0.3);
            text-shadow: 0 0 10px rgba(238, 82, 83, 0.5);
        }

        /* Cinematic Chase Stage */
        .stage {
            position: relative;
            width: 100%;
            height: 240px;
            margin-top: 50px;
            background: linear-gradient(180deg, #1e272e 0%, #0a0f1d 100%);
            border-top: 3px solid #ff9f43;
            border-bottom: 3px solid #ff9f43;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            overflow: hidden;
            display: none;
        }

        /* Advanced Graphical Container via Data-URIs */
        .sprite-container {
            position: absolute;
            display: flex;
            align-items: flex-end;
            gap: 15px;
            height: 120px;
            bottom: 25px;
        }

        /* Realistic Monkey Sprite Mapping */
        .monkeys {
            width: 180px;
            height: 90px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 120 60"><path d="M20,40 Q15,25 25,20 Q35,15 45,25 Q55,20 65,30 Q75,25 85,35 Q95,20 110,45" fill="none" stroke="%23574b90" stroke-width="8" stroke-linecap="round"/><circle cx="28" cy="22" r="9" fill="%23786fa6"/><circle cx="48" cy="26" r="8" fill="%23786fa6"/><circle cx="68" cy="32" r="9" fill="%23786fa6"/><circle cx="88" cy="36" r="8" fill="%23786fa6"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }

        /* Custom Grounded Roblox Visual Tracker Uniform Mapping */
        .fbi-agents {
            width: 260px;
            height: 120px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 160 80"><g transform="translate(10,0)"><rect x="10" y="25" width="22" height="35" fill="%232c3e50" rx="3"/><rect x="13" y="10" width="16" height="16" fill="%23ffdd59" rx="2"/><rect x="8" y="6" width="26" height="10" fill="%231e272e" rx="4"/><line x1="25" y1="35" x2="50" y2="35" stroke="%23000" stroke-width="5"/></g><g transform="translate(45,5)"><rect x="10" y="25" width="22" height="35" fill="%232c3e50" rx="3"/><rect x="13" y="10" width="16" height="16" fill="%23ffdd59" rx="2"/><rect x="8" y="6" width="26" height="10" fill="%231e272e" rx="4"/><line x1="25" y1="35" x2="50" y2="35" stroke="%23000" stroke-width="5"/></g><g transform="translate(80,-2)"><rect x="10" y="25" width="22" height="35" fill="%232c3e50" rx="3"/><rect x="13" y="10" width="16" height="16" fill="%23ffdd59" rx="2"/><rect x="8" y="6" width="26" height="10" fill="%231e272e" rx="4"/><line x1="25" y1="35" x2="50" y2="35" stroke="%23000" stroke-width="5"/></g></svg>');
            background-size: contain;
            background-repeat: no-repeat;
        }

        /* High-speed CSS Keyframe Timings */
        @keyframes runRight {
            0% { left: -300px; transform: scaleX(1); }
            100% { left: 105%; transform: scaleX(1); }
        }

        @keyframes runLeft {
            0% { right: -300px; transform: scaleX(-1); }
            100% { right: 105%; transform: scaleX(-1); }
        }

        .dir-right { animation: runRight 3.2s linear infinite; }
        .dir-left { animation: runLeft 3.2s linear infinite; }
    </style>
</head>
<body>

    <h1>Thank you for using the Monkey Control Help Line.</h1>
    <div class="subtitle">Tactical Containment & Rapid Relocation Units</div>

    <button id="dispatchBtn" onclick="startEmergencyProtocol()">Dispatch</button>

    <div id="timerDisplay">TIME UNTIL ARRIVAL: 05:00</div>

    <div class="stage" id="chaseStage">
        <!-- Rightbound Tactical Pursuit Cluster -->
        <div class="sprite-container dir-right" style="animation-delay: 0s;">
            <div class="monkeys"></div>
            <div class="fbi-agents"></div>
        </div>
        
        <!-- Leftbound Tactical Pursuit Cluster -->
        <div class="sprite-container dir-left" style="animation-delay: 1.6s;">
            <div class="monkeys"></div>
            <div class="fbi-agents"></div>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let sirenInterval = null;
        let stepInterval = null;
        let monkeyInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSiren() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(550, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(950, audioCtx.currentTime + 0.35);
            osc.frequency.linearRampToValueAtTime(550, audioCtx.currentTime + 0.7);
            gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.7);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.7);
        }

        function playFootstep() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.12);
        }

        function playMonkeyScreech() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sine';
            let now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(900, now);
            osc.frequency.linearRampToValueAtTime(2100, now + 0.04);
            osc.frequency.linearRampToValueAtTime(1400, now + 0.08);
            osc.frequency.linearRampToValueAtTime(2400, now + 0.14);
            osc.frequency.linearRampToValueAtTime(500, now + 0.22);
            gain.gain.setValueAtTime(0.07, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(now + 0.25);
        }

        function startEmergencyProtocol() {
            initAudio();
            const btn = document.getElementById('dispatchBtn');
            const timer = document.getElementById('timerDisplay');
            const stage = document.getElementById('chaseStage');
            
            btn.disabled = true;
            timer.style.visibility = 'visible';
            stage.style.display = 'block';

            sirenInterval = setInterval(playSiren, 700);
