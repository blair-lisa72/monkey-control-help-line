<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRISIS PROTOCOL: MONKEY CONTROL HELP LINE</title>
    <style>
        :root {
            --primary-glow: #ff3838;
            --secondary-glow: #ff9f43;
            --bg-dark: #060913;
            --panel-bg: rgba(13, 19, 33, 0.95);
            --border-neon: #00d2d3;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111a2e 0%, #060913 100%);
        }

        .terminal-header {
            text-align: center;
            width: 90%;
            max-width: 800px;
            padding: 20px;
            background: var(--panel-bg);
            border: 2px solid var(--secondary-glow);
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(0,0,0,0.8);
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.3rem;
            color: var(--secondary-glow);
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(255, 159, 67, 0.5);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #48dbfb;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-container {
            margin: 20px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #dispatchBtn {
            background: radial-gradient(circle, #ff4d4d 0%, #c0392b 100%);
            color: white;
            border: 6px solid #ff6b6b;
            border-radius: 50%;
            width: 170px;
            height: 170px;
            font-size: 1.6rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.6), inset 0 4px 10px rgba(255,255,255,0.4);
            transition: all 0.2s ease;
            outline: none;
            letter-spacing: 1px;
            position: relative;
            z-index: 10;
        }

        #dispatchBtn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.9);
        }

        #dispatchBtn:disabled {
            background: #222f3e !important;
            border-color: #57606f !important;
            color: #57606f !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        #statusDisplay {
            font-size: 2.3rem;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            color: #2ed573;
            display: none;
            font-weight: 900;
            background: #000000;
            padding: 15px 35px;
            border-radius: 8px;
            border: 2px solid #2ed573;
            box-shadow: 0 0 25px rgba(46, 213, 115, 0.5);
            text-shadow: 0 0 10px rgba(46, 213, 115, 0.8);
            text-align: center;
            max-width: 80%;
            letter-spacing: 1px;
        }

        .stage {
            position: relative;
            width: 100%;
            height: 260px;
            margin-top: 40px;
            background: linear-gradient(180deg, #0e1424 0%, #04060f 100%);
            border-top: 4px solid var(--border-neon);
            border-bottom: 4px solid var(--border-neon);
            box-shadow: inset 0 0 40px rgba(0,210,211,0.2);
            overflow: hidden;
            display: none;
        }

        .sprite-cluster {
            position: absolute;
            display: flex;
            align-items: flex-end;
            bottom: 20px;
            height: 160px;
        }

        .fbi-strike-team {
            display: flex;
            gap: 6px;
        }

        /* High-Definition Tactical Specialist blueprint layout */
        .operator {
            width: 70px;
            height: 130px;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 80 140"><rect x="22" y="50" width="36" height="55" fill="%232c3e50" stroke="%231a252f" stroke-width="2"/><rect x="26" y="55" width="28" height="30" fill="%231e272e"/><circle cx="40" cy="30" r="16" fill="%232c3e50"/><path d="M26,24 Q40,12 54,24 Q56,34 40,36 Q24,34 26,24" fill="%2311171d"/><rect x="28" y="22" width="24" height="11" fill="%23ffd32a" rx="2"/><rect x="18" y="52" width="10" height="40" fill="%2334495e" rx="4"/><rect x="52" y="52" width="10" height="40" fill="%2334495e" rx="4"/><rect x="24" y="105" width="14" height="30" fill="%231e272e"/><rect x="42" y="105" width="14" height="30" fill="%231e272e"/><rect x="45" y="60" width="40" height="12" fill="%23000000" rx="2" transform="rotate(-10, 45, 60)"/></svg>');
        }

        .monkey-swarm {
            display: flex;
            gap: 10px;
        }

        /* High-Definition Realistic Ape asset blueprint mapping */
        .rogue-monkey {
            width: 65px;
            height: 95px;
            background-size: contain;
            background-repeat: no-repeat;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" viewBox="0 0 80 100"><circle cx="40" cy="45" r="22" fill="%23574b90"/><circle cx="40" cy="43" r="16" fill="%23f7d794"/><circle cx="20" cy="38" r="8" fill="%23574b90"/><circle cx="60" cy="38" r="8" fill="%23574b90"/><circle cx="33" cy="38" r="3" fill="%23000"/><circle cx="47" cy="38" r="3" fill="%23000"/><path d="M32,54 Q40,62 48,54" fill="none" stroke="%23000" stroke-width="3"/><rect x="25" y="65" width="30" height="30" fill="%23574b90" rx="10"/></svg>');
        }

        @keyframes sweepRight {
            0% { left: -500px; }
            100% { left: 105%; }
        }

        @keyframes sweepLeft {
            0% { right: -500px; transform: scaleX(-1); }
            100% { right: 105%; transform: scaleX(-1); }
        }

        .run-east { animation: sweepRight 3.2s linear infinite; }
        .run-west { animation: sweepLeft 3.2s linear infinite; }
    </style>
</head>
